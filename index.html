<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Villa Park Basketball Overlay</title><style>
:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}.scoreboard{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;min-width:490px;height:75px;border-radius:12px;overflow:hidden;background:rgba(9,22,44,.93);border:2px solid rgba(255,255,255,.8);box-shadow:0 3px 12px rgba(0,0,0,.3);color:white}.team{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 15px;min-width:180px}.team.home{background:#173d78}.team.away{background:#222b3c}.name{font-size:15px;font-weight:800;letter-spacing:.5px;white-space:nowrap}.score{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums}.middle{min-width:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#0b1527;border-left:1px solid #74839b;border-right:1px solid #74839b}.period{font-size:13px;font-weight:800;color:#c6d8f4}.period{font-size:22px}@media(max-width:550px){.scoreboard{transform:translateX(-50%) scale(.75);transform-origin:top center}}
.scoreboard{position:static;transform:none;height:75px;min-width:490px}.overlayWrap{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:white}.eventBanner{background:#173d78;text-align:center;padding:5px 10px;border:1px solid #fff;border-radius:8px 8px 0 0;font-size:14px;font-weight:bold;max-width:680px;overflow-wrap:anywhere}.teamInfo{display:flex;flex-direction:column;gap:4px}.fouls{font-size:11px;color:#e4eafa}.bonus{color:#ffda6b;font-size:11px;font-weight:bold}.team.away .teamInfo{text-align:right}@media(max-width:550px){.overlayWrap{transform:translateX(-50%) scale(.75);transform-origin:top center}.scoreboard{transform:none}}
.overlayWrap{top:auto;bottom:18px}.spotlight{position:absolute;bottom:calc(100% + 7px);left:0;width:285px;display:flex;align-items:center;gap:10px;padding:8px;background:#142b52;border:1px solid white;border-radius:9px;box-shadow:0 3px 10px #0005;color:white;animation:rise .18s ease-out}.spotlight[hidden]{display:none}.spotPhoto{width:64px;height:64px;object-fit:contain}.spotNumber{font-size:24px;font-weight:bold}.spotName{font-size:16px;font-weight:bold;overflow-wrap:anywhere}.spotPoints{color:#ffdc70;font-size:19px;font-weight:bold}.spotTotal{font-size:12px}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:550px){.overlayWrap{transform-origin:bottom center}}
</style><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script></head><body><div class="overlayWrap"><div id="spotlight" class="spotlight" hidden><img id="spotPhoto" class="spotPhoto" alt="" hidden><div id="spotNumber" class="spotNumber"></div><div><div id="spotName" class="spotName"></div><div id="spotPoints" class="spotPoints"></div><div id="spotTotal" class="spotTotal"></div></div></div><div id="eventBanner" class="eventBanner" hidden></div><div class="scoreboard" role="img" aria-label="Basketball scoreboard"><div class="team home"><div class="teamInfo"><span class="name" id="homeName">VILLA PARK</span><span class="fouls" id="homeFouls" hidden></span><span class="bonus" id="homeBonus" hidden>BONUS</span></div><span class="score" id="homeScore">42</span></div><div class="middle"><span class="period" id="period">Q3</span></div><div class="team away"><span class="score" id="awayScore">38</span><div class="teamInfo"><span class="name" id="awayName">OPPONENT</span><span class="fouls" id="awayFouls" hidden></span><span class="bonus" id="awayBonus" hidden>BONUS</span></div></div></div></div><script>
// Standalone visual test. URL parameters can set initial display, e.g. ?home=42&away=38&q=3&opponent=ESPERANZA
const params=new URLSearchParams(location.search);const fields={home:'homeScore',away:'awayScore',q:'period',opponent:'awayName'};for(const [key,id] of Object.entries(fields)){const value=params.get(key);if(value!==null){document.getElementById(id).textContent=key==='q'&&!/^Q/i.test(value)?'Q'+value:value.slice(0,24)}}
</script><script>
let spotTimer,seenSpot=null,initialLive=true;
function renderSpot(s,preview=false){const box=document.getElementById('spotlight');if(!s||!s.id){clearTimeout(spotTimer);box.hidden=true;return;}if(s.id===seenSpot)return;seenSpot=s.id;clearTimeout(spotTimer);const remaining=5000-(Date.now()-Number(s.at));if(!preview&&(initialLive||remaining<=0||remaining>5500)){box.hidden=true;return;}document.getElementById('spotNumber').textContent='#'+String(s.number||'—');document.getElementById('spotName').textContent=String(s.name||'');document.getElementById('spotPoints').textContent='+'+Number(s.points)+' POINTS';document.getElementById('spotTotal').textContent=Number(s.total)+' TOTAL POINTS';const img=document.getElementById('spotPhoto');img.hidden=!(typeof s.photo==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(s.photo));if(!img.hidden)img.src=s.photo;else img.removeAttribute('src');box.hidden=false;spotTimer=setTimeout(()=>box.hidden=true,preview?5000:remaining);}
if(params.get('preview')==='1')renderSpot({id:'preview',at:Date.now(),name:'TEST PLAYER',number:'11',points:3,total:12},true);
function renderDetails(s){const banner=document.getElementById('eventBanner');banner.textContent=String(s.eventTitle||'').slice(0,80);banner.hidden=!banner.textContent.trim();for(const t of ['home','away']){const f=document.getElementById(t+'Fouls');f.hidden=typeof s[t+'Fouls']!=='number';f.textContent='FOULS: '+(s[t+'Fouls']??0);document.getElementById(t+'Bonus').hidden=s[t+'Bonus']!==true;}}
if(params.get('preview')==='1')renderDetails({eventTitle:params.get('event')||'THANKSGIVING TOURNAMENT',homeFouls:3,awayFouls:5,homeBonus:true,awayBonus:false});
const firebaseConfig = {apiKey:"AIzaSyCmbcrD-d1zMFjkdWKvpJBxqEDp-3BNjZQ",authDomain:"vp-basketball-live.firebaseapp.com",databaseURL:"https://vp-basketball-live-default-rtdb.firebaseio.com",projectId:"vp-basketball-live",storageBucket:"vp-basketball-live.firebasestorage.app",messagingSenderId:"405301992818",appId:"1:405301992818:web:17f0ee3bb0f90be69c51eb"};
try{
 if(params.get('preview')!=='1'){firebase.initializeApp(firebaseConfig);
 firebase.database().ref('liveScore').on('value',snap=>{
  const s=snap.val();if(!s){initialLive=false;return;}renderDetails(s);renderSpot(s.spotlight);initialLive=false;
  document.getElementById('homeScore').textContent=Number(s.home)||0;
  document.getElementById('awayScore').textContent=Number(s.away)||0;
  document.getElementById('period').textContent=String(s.period||'Q1').slice(0,4);
   document.getElementById('awayName').textContent=String(s.opponent||params.get('opponent')||'OPPONENT').slice(0,24).toUpperCase();
 },error=>console.error('Live score read failed:',error));}
}catch(e){console.error('Firebase initialization failed:',e);}
</script></body></html>
