<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Villa Park Basketball Overlay</title><style>
:root{color-scheme:dark}html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}.scoreboard{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;min-width:490px;height:75px;border-radius:12px;overflow:hidden;background:rgba(9,22,44,.93);border:2px solid rgba(255,255,255,.8);box-shadow:0 3px 12px rgba(0,0,0,.3);color:white}.team{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 15px;min-width:180px}.team.home{background:#173d78}.team.away{background:#222b3c}.name{font-size:15px;font-weight:800;letter-spacing:.5px;white-space:nowrap}.score{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums}.middle{min-width:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#0b1527;border-left:1px solid #74839b;border-right:1px solid #74839b}.period{font-size:13px;font-weight:800;color:#c6d8f4}.clock{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}@media(max-width:550px){.scoreboard{transform:translateX(-50%) scale(.75);transform-origin:top center}}
</style></head><body><div class="scoreboard" role="img" aria-label="Basketball scoreboard"><div class="team home"><span class="name" id="homeName">VILLA PARK</span><span class="score" id="homeScore">42</span></div><div class="middle"><span class="period" id="period">Q3</span><span class="clock" id="clock">5:42</span></div><div class="team away"><span class="score" id="awayScore">38</span><span class="name" id="awayName">OPPONENT</span></div></div><script>
// Standalone visual test. URL parameters can set initial display, e.g. ?home=42&away=38&q=3&clock=5%3A42&opponent=ESPERANZA
const params=new URLSearchParams(location.search);const fields={home:'homeScore',away:'awayScore',q:'period',clock:'clock',opponent:'awayName'};for(const [key,id] of Object.entries(fields)){const value=params.get(key);if(value!==null){document.getElementById(id).textContent=key==='q'&&!/^Q/i.test(value)?'Q'+value:value.slice(0,24)}}
</script></body></html>
